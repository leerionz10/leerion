<!doctype html>
<html lang="ko">
<head>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-title">콘텐츠 관리</div>
      <button class="nav active" data-tab="appearance">▧　배경화면 & 홈</button>
      <button class="nav" data-tab="photos">✿　사진 갤러리</button>

    </section>
