<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>StoryPhone — 인터랙티브 웹 아이폰</title>
<style>
:root{--ink:#101116;--muted:#8b8c94;--blue:#1684ff;--glass:rgba(255,255,255,.13);--wall:linear-gradient(145deg,#17233c 0%,#6e8ca8 43%,#e4b4a1 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#101116;color:#fff;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;gap:22px}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.layout{display:flex;align-items:center;gap:22px;width:min(100%,980px);justify-content:center}
.phone{width:min(390px,100%);height:min(844px,calc(100dvh - 36px));min-height:600px;border:7px solid #282a30;border-radius:48px;box-shadow:0 25px 80px #0009,inset 0 0 0 2px #555;overflow:hidden;position:relative;background:#12141a;flex-shrink:0}
.island{position:absolute;z-index:30;top:10px;left:50%;transform:translateX(-50%);height:27px;width:105px;border-radius:20px;background:#050506}
.status{position:absolute;z-index:25;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:9px 24px 0;font-size:12px;font-weight:700;pointer-events:none;text-shadow:0 1px 5px #0006}
.status .right{display:flex;gap:5px;align-items:center}
.screen{height:100%;position:relative;overflow:hidden;background:var(--wall);background-size:cover;background-position:center;transition:background .3s}
.lock{position:absolute;inset:0;padding:90px 22px 30px;text-align:center;background:linear-gradient(#0001,#0001 45%,#0005);display:flex;flex-direction:column;align-items:center}
.lock .date{font-size:17px;font-weight:500;text-shadow:0 2px 8px #0005}
.lock .clock{font-size:82px;font-weight:250;letter-spacing:-4px;line-height:1.1;text-shadow:0 2px 8px #0003}
.lock .lock-notifs{width:100%;margin-top:34px;display:grid;gap:9px;text-align:left}
.notif{background:rgba(245,246,250,.83);color:#202126;border-radius:18px;padding:12px 14px;backdrop-filter:blur(20px);font-size:12px}
.notif strong{display:block;font-size:13px;margin-bottom:3px}.unlock{margin-top:auto;font-size:12px;color:#fff;opacity:.9;animation:pulse 2s infinite}.shortcuts{display:flex;justify-content:space-between;width:100%;margin-top:15px}.circlebtn{width:43px;height:43px;border-radius:50%;background:#17181d88;color:white;border:1px solid #ffffff4c;font-size:20px}
@keyframes pulse{50%{opacity:.5}}
.home{position:absolute;inset:0;padding:58px 18px 35px;background:#0001;display:none}
.welcome{font-size:13px;opacity:.8;margin:3px 0 20px 3px}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}
.appicon{background:transparent;color:white;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.appicon .ico{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:29px;box-shadow:0 4px 9px #0002;position:relative}
.appicon span:last-child{font-size:10px;text-shadow:0 1px 3px #0008;white-space:nowrap}
.badge{position:absolute;right:-6px;top:-5px;background:#ff3b30;border-radius:20px;padding:2px 6px;font-size:11px}
.dock{position:absolute;bottom:30px;left:13px;right:13px;height:82px;border-radius:27px;background:#ffffff36;backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-evenly}
.dock .appicon .ico{width:52px;height:52px}
.appview{position:absolute;inset:0;background:#f5f5f9;color:#17171b;display:none;z-index:10;padding-top:45px}
.apphead{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-weight:700;font-size:18px}
.back{background:none;color:var(--blue);font-size:15px;padding:8px 0}
.appbody{height:calc(100% - 95px);overflow:auto;padding:12px 15px 28px}
.homebar{position:absolute;z-index:35;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:9px;background:#fff;mix-blend-mode:difference;cursor:pointer}
.lockbar{position:absolute;z-index:36;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:9px;background:#fff;cursor:pointer}
.searchbox{width:100%;border:0;border-radius:12px;padding:12px;background:#e7e7ec;outline:none;color:#111}
.rowitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #dedee4;cursor:pointer}
.avatar{width:43px;height:43px;border-radius:50%;background:#d7dbe5;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.rowitem small{display:block;color:#777;margin-top:4px}.bubble{max-width:82%;padding:10px 13px;border-radius:18px;margin:8px 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.in{background:#e4e4e9;border-bottom-left-radius:5px}.bubble.out{background:#1684ff;color:white;margin-left:auto;border-bottom-right-radius:5px}
.chatarea{height:calc(100% - 105px);overflow:auto;display:flex;flex-direction:column;padding:10px 3px}
.composer{display:flex;gap:7px;align-items:center;padding:8px 0 3px}.composer input{min-width:0;flex:1;border:1px solid #c8c8ce;border-radius:22px;padding:10px 13px;background:#fff;color:#111}.send{background:var(--blue);color:white;border-radius:20px;padding:10px 13px}
.card{background:#fff;border-radius:16px;padding:14px;margin:9px 0;box-shadow:0 1px 3px #0000}.muted{color:#777;font-size:12px}.btn{background:var(--blue);color:white;border-radius:12px;padding:10px 13px}.btn.secondary{background:#e5e5eb;color:#222}.field{display:grid;gap:5px;margin:12px 0;font-size:13px}.field input,.field textarea,.field select{border:1px solid #d1d1d8;border-radius:10px;padding:10px;color:#111;background:#fff;width:100%}.field textarea{min-height:74px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}
.music-cover{width:220px;max-width:80%;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 10px 28px #0002;display:block;margin:20px auto}
.progress{width:100%;accent-color:#555}.playrow{display:flex;align-items:center;justify-content:center;gap:26px;margin:20px}
.callnumber{font-size:35px;text-align:center;letter-spacing:2px;min-height:45px;margin:28px 0 16px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:270px;margin:auto}.key{width:70px;height:70px;border-radius:50%;background:#e3e3e8;font-size:25px;justify-self:center}.key small{display:block;font-size:9px;letter-spacing:2px}.callbtn{display:block;margin:20px auto;background:#32c65b;color:#fff;width:65px;height:65px;border-radius:50%;font-size:25px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:5px}.calgrid button{padding:8px 0;border-radius:50%;background:transparent;color:#222}.calgrid button.today{background:#1684ff;color:white}
.admin{width:min(360px,100%);max-height:min(844px,calc(100dvh - 36px));overflow:auto;background:#1b1d24;border:1px solid #3b3d45;border-radius:24px;padding:19px;color:#f4f4f7}
.admin h2{font-size:18px;margin:0 0 4px}.admin p{font-size:12px;color:#aeb0ba;line-height:1.5}.admin .field{color:#ddd}.admin .field input,.admin .field textarea,.admin .field select{background:#292b34;color:#fff;border-color:#454752}.admin .btn{width:100%;margin-top:8px}.admin summary{cursor:pointer;padding:10px 0;font-weight:700}.toast{position:absolute;z-index:50;top:55px;left:15px;right:15px;padding:12px;border-radius:15px;background:#fffffff0;color:#222;display:none;font-size:13px}
@media(max-width:760px){body{padding:0;display:block;background:#08090c}.layout{display:block;width:100%}.phone{width:100%;height:100dvh;min-height:560px;border:0;border-radius:0;box-shadow:none}.island{top:8px}.admin{position:fixed;z-index:80;left:10px;right:10px;bottom:10px;width:auto;max-height:76dvh;display:none;box-shadow:0 0 0 999px #0008}.admin.open{display:block}.admin-toggle{position:fixed;z-index:70;right:12px;bottom:17px;border-radius:50%;width:46px;height:46px;background:#262a33;color:#fff;border:1px solid #555;font-size:20px}.lock{padding-top:95px}}
@media(min-width:761px){.admin-toggle{display:none}}
</style>
</head>
<body>
<div class="layout">
<div class="phone" aria-label="인터랙티브 웹 아이폰">
<div class="screen" id="screen">
<div class="status"><span id="statusTime">9:41</span><span class="right">▮▮▮　◉　▰</span></div><div class="island"></div>
<section class="lock" id="lock">
<div class="date" id="lockDate">10월 21일 수요일</div><div class="clock" id="lockClock">9:41</div>
<div class="lock-notifs" id="notifications"></div>
<div class="shortcuts"><button class="circlebtn" onclick="toast('손전등은 화면 연출 기능입니다')">⌁</button><button class="circlebtn" onclick="openApp('camera')">◎</button></div>
<div class="unlock" onclick="unlock()">위로 쓸어 올려 열기 ↑</div>
</section>
<section class="home" id="home"><div class="welcome" id="welcome">좋은 하루야.</div><div class="appgrid" id="appgrid"></div><div class="dock" id="dock"></div></section>
<section class="appview" id="appview"><div class="apphead"><button class="back" onclick="goHome()">‹ 홈</button><span id="appTitle">메시지</span><button class="back" onclick="openAdmin()">•••</button></div><div class="appbody" id="appbody"></div></section>
<div class="toast" id="toast"></div><div class="lockbar" id="lockbar" onclick="homeGesture()"></div>
</div></div>
<aside class="admin" id="admin">
<h2>⚙ StoryPhone 스튜디오</h2>
<div class="card" style="background:#292b34;color:#fff">
  <b>관리자 계정</b><p id="adminAuthStatus" style="color:#c6c8d0">로그인 상태 확인 중</p>
  <label class="field">이메일<input id="adminEmail" type="email" placeholder="관리자 이메일"></label>
  <label class="field">비밀번호<input id="adminPassword" type="password" placeholder="관리자 비밀번호"></label>
  <button class="btn" id="adminLoginButton" onclick="adminLogin()">관리자 로그인</button>
  <button class="btn secondary" id="adminLogoutButton" onclick="adminLogout()" style="display:none">로그아웃</button>
</div>
<p>이 데모는 현재 브라우저에서 작동합니다. 설정은 이 기기의 브라우저에 저장됩니다. 공개 링크 전체에 설정을 공유하려면 서버/데이터베이스 연결이 필요해요.</p>
<details open><summary>🎨 잠금 화면 & 스토리</summary>
<label class="field">상단 인사말<input id="cfgWelcome" value="좋은 하루야."></label>
<label class="field">배경 이미지 URL<input id="cfgWall" placeholder="https://... 이미지 주소"></label>
<label class="field">알림 문구<textarea id="cfgNotif">정이안|지금 뭐 해? 답장 기다리는 중…</textarea></label>
<label class="field">스토리 소개 문구<textarea id="cfgStory">어느 평범한 날, 잠금 화면에 낯익은 이름이 떠 있었다.</textarea></label>
</details>
<details open><summary>💬 메시지 자동 답장</summary>
<label class="field">상대 이름<input id="cfgName" value="정이안"></label>
<label class="field">대화 시작 내용<textarea id="cfgChat">in|오늘 뭐 해?\nout|그냥 집에 있어\nin|아 진짜? 나도 심심한데</textarea></label>
<p>답장 규칙: 한 줄에 <code>키워드|답장</code>. 키워드가 비어 있으면 기본 답장으로 사용해요.</p>
<label class="field">자동 답장 규칙<textarea id="cfgRules">안녕|안녕, 연락 기다렸어\n뭐 해|그냥 너 생각 중\n보고 싶|나도 보고 싶어\n잘 자|응, 좋은 꿈 꿔\n|ㅋㅋ 갑자기 왜?</textarea></label>
</details>
<details><summary>🖼 갤러리 사진</summary><label class="field">사진 URL (한 줄에 하나)<textarea id="cfgPhotos" placeholder="https://images.unsplash.com/..."></textarea></label></details>
<details><summary>🎵 음악</summary>
<label class="field">곡명<input id="cfgSong" value="밤의 산책"></label><label class="field">아티스트<input id="cfgArtist" value="StoryPhone"></label><label class="field">앨범 커버 URL<input id="cfgCover" placeholder="https://..."></label><label class="field">음악 파일 URL<input id="cfgAudio" placeholder="https://...mp3"></label>
</details>
<details><summary>📅 캘린더 & 검색 기록</summary>
<label class="field">캘린더 일정<textarea id="cfgEvents">2026-10-21|오후 7:00|이안에게 연락하기\n2026-10-23|오후 4:30|비밀 약속</textarea></label>
<label class="field">Safari 검색 기록<textarea id="cfgHistory">오늘 날씨\n가까운 카페\n좋아하는 노래 가사</textarea></label>
</details>
<details><summary>📞 전화 & 연락처</summary>
<label class="field">연락처 (한 줄에 이름|번호)<textarea id="cfgContacts">정이안|010-1234-5678\n엄마|010-0000-0000</textarea></label>
</details>
<button class="btn" onclick="saveConfig()">설정 저장하고 적용</button><button class="btn secondary" onclick="resetConfig()">기본 설정 복원</button><button class="btn secondary" onclick="closeAdmin()">닫기</button>
</aside>
<button class="admin-toggle" onclick="openAdmin()" aria-label="관리자 설정">⚙</button>
</div>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const defaults={welcome:"좋은 하루야.",wall:"",notif:"정이안|지금 뭐 해? 답장 기다리는 중…",story:"어느 평범한 날, 잠금 화면에 낯익은 이름이 떠 있었다.",name:"정이안",chat:"in|오늘 뭐 해?\nout|그냥 집에 있어\nin|아 진짜? 나도 심심한데",rules:"안녕|안녕, 연락 기다렸어\n뭐 해|그냥 너 생각 중\n보고 싶|나도 보고 싶어\n잘 자|응, 좋은 꿈 꿔\n|ㅋㅋ 갑자기 왜?",photos:"",song:"밤의 산책",artist:"StoryPhone",cover:"",audio:"",events:"2026-10-21|오후 7:00|이안에게 연락하기\n2026-10-23|오후 4:30|비밀 약속",history:"오늘 날씨\n가까운 카페\n좋아하는 노래 가사",contacts:"정이안|010-1234-5678\n엄마|010-0000-0000"};
let cfg={...defaults},messages=[],activeChat=false,callNum="",audio=null,playing=false;
let sb=null, adminSession=null, remoteConfigLoaded=false;
function initSupabase(){
  const u=window.STORYPHONE_CONFIG?.supabaseUrl||"";
  const k=window.STORYPHONE_CONFIG?.supabaseAnonKey||"";
  if(u && k && window.supabase?.createClient){
    sb=window.supabase.createClient(u,k);
    sb.auth.getSession().then(({data})=>{adminSession=data.session;refreshAdminAuthUI()});
    sb.auth.onAuthStateChange((_event,session)=>{adminSession=session;refreshAdminAuthUI()});
    loadSharedConfig();
  }
}
async function loadSharedConfig(){
  if(!sb)return;
  try{
    const {data,error}=await sb.from("storyphone_config").select("config").eq("id","main").maybeSingle();
    if(error)throw error;
    if(data?.config){cfg={...defaults,...data.config};fillAdmin();applyConfig();remoteConfigLoaded=true}
  }catch(e){console.warn("Shared config not available; using this browser's saved config.",e.message)}
}
function refreshAdminAuthUI(){
  const el=document.getElementById("adminAuthStatus");
  if(el)el.textContent=adminSession?"관리자 로그인됨":"관리자 로그인 필요";
  const login=document.getElementById("adminLoginButton"), logout=document.getElementById("adminLogoutButton");
  if(login)login.style.display=adminSession?"none":"block";
  if(logout)logout.style.display=adminSession?"block":"none";
}
async function adminLogin(){
  if(!sb){toast("먼저 config.js에 Supabase URL과 anon key를 설정해 주세요");return}
  const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value;
  if(!email||!password){toast("관리자 이메일과 비밀번호를 입력해 주세요");return}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){toast("로그인 실패: "+error.message);return}
  toast("관리자 로그인 완료");
}
async function adminLogout(){if(sb)await sb.auth.signOut();adminSession=null;refreshAdminAuthUI();toast("로그아웃했어요")}

const $=id=>document.getElementById(id);
const appInfo=[["messages","메시지","💬","#31c75a"],["photos","사진","🌈","#fff"],["phone","전화","📞","#36c76c"],["music","음악","🎵","#fa4168"],["calendar","캘린더","📅","#fff"],["safari","Safari","🧭","#fff"],["notes","메모","📝","#ffdf70"],["settings","설정","⚙️","#c5c8ce"],["camera","카메라","📷","#444"],["clock","시계","⏰","#292a30"],["story","스토리","📖","#d8c3a8"],["mail","메일","✉️","#1684ff"]];
function readConfig(){try{const saved=localStorage.getItem("storyphone-config");if(saved)cfg={...defaults,...JSON.parse(saved)}}catch(e){}}
function fillAdmin(){let map={cfgWelcome:"welcome",cfgWall:"wall",cfgNotif:"notif",cfgStory:"story",cfgName:"name",cfgChat:"chat",cfgRules:"rules",cfgPhotos:"photos",cfgSong:"song",cfgArtist:"artist",cfgCover:"cover",cfgAudio:"audio",cfgEvents:"events",cfgHistory:"history",cfgContacts:"contacts"};for(let id in map)$(id).value=cfg[map[id]]||""}
async function saveConfig(){let map={cfgWelcome:"welcome",cfgWall:"wall",cfgNotif:"notif",cfgStory:"story",cfgName:"name",cfgChat:"chat",cfgRules:"rules",cfgPhotos:"photos",cfgSong:"song",cfgArtist:"artist",cfgCover:"cover",cfgAudio:"audio",cfgEvents:"events",cfgHistory:"history",cfgContacts:"contacts"};for(let id in map)cfg[map[id]]=$(id).value;try{localStorage.setItem("storyphone-config",JSON.stringify(cfg))}catch(e){}
applyConfig();
if(sb){
  if(!adminSession){toast("이 브라우저에만 저장했어요. 모든 방문자에게 공유하려면 관리자 로그인 후 다시 저장하세요.");closeAdmin();return}
  try{
    const {error}=await sb.from("storyphone_config").upsert({id:"main",config:cfg,updated_at:new Date().toISOString()});
    if(error)throw error;
    toast("저장 완료 — 모든 방문자에게 설정이 공유돼요");
  }catch(e){toast("공유 저장 실패: "+e.message)}
}else{toast("이 브라우저에 저장했어요. 공개 공유는 Supabase 설정 후 가능해요")}
closeAdmin()
}
function resetConfig(){if(!confirm("기본 설정으로 되돌릴까요?"))return;cfg={...defaults};localStorage.removeItem("storyphone-config");fillAdmin();applyConfig();toast("기본 설정을 복원했어요")}
function applyConfig(){ $("welcome").textContent=cfg.welcome;$("screen").style.background=cfg.wall?`linear-gradient(#0001,#0002),url("${cfg.wall.replace(/"/g,"%22")}") center/cover`:'';$("notifications").innerHTML="";cfg.notif.split("\n").filter(Boolean).forEach(line=>{let [a,b]=line.split("|");let d=document.createElement("div");d.className="notif";d.innerHTML="<strong>"+esc(a||"메시지")+"</strong>"+esc(b||"새로운 알림");$("notifications").append(d)});renderHome()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderHome(){let grid=$("appgrid"),dock=$("dock");grid.innerHTML="";dock.innerHTML="";appInfo.forEach((a,i)=>{let b=document.createElement("button");b.className="appicon";b.innerHTML=`<span class="ico" style="background:${a[3]};color:${["photos","calendar","notes","settings","safari"].includes(a[0])?"#222":"white"}">${a[2]}</span><span>${a[1]}</span>`;b.onclick=()=>openApp(a[0]);(i<4?dock:grid).append(b)})}
function unlock(){$("lock").style.display="none";$("home").style.display="block";$("appview").style.display="none";$("lockbar").className="homebar"}
function homeGesture(){if($("appview").style.display==="block")goHome();else if($("home").style.display==="block"){ $("home").style.display="none";$("lock").style.display="flex";$("lockbar").className="lockbar"}else unlock()}
function goHome(){$("appview").style.display="none";$("home").style.display="block";$("lock").style.display="none";$("lockbar").className="homebar"}
function openAdmin(){$("admin").classList.add("open");$("admin").style.display="block"}
function closeAdmin(){$("admin").classList.remove("open");if(innerWidth<=760)$("admin").style.display="none"}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>{$("toast").style.display="none"},2300)}
function openApp(id){unlock();$("appview").style.display="block";$("home").style.display="none";$("appTitle").textContent=(appInfo.find(a=>a[0]===id)||[])[1]||id;$("appbody").innerHTML="";({messages:renderMessages,photos:renderPhotos,phone:renderPhone,music:renderMusic,calendar:renderCalendar,safari:renderSafari,notes:renderNotes,settings:renderSettings,camera:renderCamera,clock:renderClock,story:renderStory,mail:renderMail}[id]||renderStory)()}
function renderMessages(){let body=$("appbody");body.innerHTML=`<div id="chatlist"><div class="rowitem" onclick="openChat()"><div class="avatar">🙂</div><div><b>${esc(cfg.name)}</b><small> ${esc(cfg.chat.split("\n").slice(-1)[0]?.split("|").slice(1).join("|")||"메시지")}</small></div></div></div>`}
function openChat(){activeChat=true;let body=$("appbody");messages=[];cfg.chat.split("\n").filter(Boolean).forEach(l=>{let [side,...txt]=l.split("|");messages.push({side:side==="out"?"out":"in",text:txt.join("|")})});drawChat()}
function drawChat(){let body=$("appbody");body.innerHTML=`<div class="muted" style="text-align:center">오늘 · ${esc(cfg.name)}</div><div class="chatarea" id="chatarea"></div><form class="composer" id="msgform"><input id="msginput" placeholder="iMessage" autocomplete="off"><button class="send">↑</button></form>`;let area=$("chatarea");messages.forEach(m=>{let d=document.createElement("div");d.className="bubble "+m.side;d.textContent=m.text;area.append(d)});area.scrollTop=area.scrollHeight;$("msgform").onsubmit=e=>{e.preventDefault();let val=$("msginput").value.trim();if(!val)return;messages.push({side:"out",text:val});drawChat();let reply=cfg.rules.split("\n").map(x=>x.split("|")).find(x=>x.length>1&&x[0].trim()&&val.toLowerCase().includes(x[0].trim().toLowerCase()));let fallback=cfg.rules.split("\n").map(x=>x.split("|")).find(x=>x.length>1&&!x[0].trim());let answer=reply?reply.slice(1).join("|"):fallback?fallback.slice(1).join("|"):"응, 무슨 일이야?";setTimeout(()=>{messages.push({side:"in",text:answer});if($("appTitle").textContent==="메시지")drawChat()},650)}}
function renderPhotos(){let urls=cfg.photos.split("\n").map(x=>x.trim()).filter(Boolean);$("appbody").innerHTML=`<p class="muted">사진 · ${urls.length}장</p><div class="photo-grid">${urls.map((u,i)=>`<img src="${esc(u)}" alt="사진 ${i+1}" onclick="viewPhoto('${encodeURIComponent(u)}')" onerror="this.style.opacity=.25">`).join("")||'<p class="muted">관리자 설정에서 사진 URL을 추가해 보세요.</p>'}</div>`}
function viewPhoto(u){let url=decodeURIComponent(u);$("appbody").innerHTML=`<button class="back" onclick="renderPhotos()">‹ 모든 사진</button><img src="${esc(url)}" style="width:100%;border-radius:14px;margin-top:15px"><p class="muted">StoryPhone 사진</p>`}
function renderMusic(){let cover=cfg.cover||"https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600";$("appbody").innerHTML=`<p class="muted" style="text-align:center">지금 재생 중</p><img class="music-cover" src="${esc(cover)}"><div style="text-align:center;font-size:22px;font-weight:700">${esc(cfg.song)}</div><p style="text-align:center;color:#777">${esc(cfg.artist)}</p><input class="progress" type="range" min="0" max="100" value="0" id="musicprogress"><div class="playrow"><button onclick="toast('이전 곡이 없어요')">⏮</button><button class="btn" id="playbtn" onclick="toggleMusic()">▶ 재생</button><button onclick="toast('다음 곡이 없어요')">⏭</button></div><p class="muted">재생할 수 있는 오디오 URL을 관리자 설정에 넣으면 음악이 재생돼요.</p>`;if(cfg.audio){audio=new Audio(cfg.audio);audio.onended=()=>{playing=false;$("playbtn").textContent="▶ 재생"};audio.ontimeupdate=()=>{if(audio.duration)$("musicprogress").value=audio.currentTime/audio.duration*100}}}
function toggleMusic(){if(!audio){toast("관리자 설정에서 음악 파일 URL을 추가해 주세요");return}if(playing){audio.pause();playing=false;$("playbtn").textContent="▶ 재생"}else{audio.play().then(()=>{playing=true;$("playbtn").textContent="Ⅱ 일시정지"}).catch(()=>toast("이 오디오 주소를 재생할 수 없어요"))}}
function renderPhone(){let contacts=cfg.contacts.split("\n").filter(Boolean).map(x=>x.split("|"));$("appbody").innerHTML=`<div class="callnumber" id="callnumber">${esc(callNum)}</div><div class="keypad">${["1","2","3","4","5","6","7","8","9","*","0","#"].map(n=>`<button class="key" onclick="callNum+= '${n}';$('callnumber').textContent=callNum">${n}<small>${({"2":"ABC","3":"DEF","4":"GHI","5":"JKL","6":"MNO","7":"PQRS","8":"TUV","9":"WXYZ"})[n]||""}</small></button>`).join("")}</div><button class="callbtn" onclick="toast('시뮬레이션 통화입니다. 실제 전화는 걸리지 않아요.')">☎</button><button class="btn secondary" onclick="callNum='';$('callnumber').textContent=''">지우기</button><h3>연락처</h3>${contacts.map(c=>`<div class="rowitem" onclick="callNum='${esc(c[1]||"")}';$('callnumber').textContent=callNum"><div class="avatar">👤</div><div><b>${esc(c[0])}</b><small>${esc(c[1]||"")}</small></div></div>`).join("")}`}
function renderCalendar(){let d=new Date(),year=d.getFullYear(),month=d.getMonth();let days=new Date(year,month+1,0).getDate(),start=new Date(year,month,1).getDay();let html=`<h2>${year}년 ${month+1}월</h2><div class="calgrid">${["일","월","화","수","목","금","토"].map(x=>`<b class="muted">${x}</b>`).join("")}${Array.from({length:start},()=>"<span></span>").join("")}${Array.from({length:days},(_,i)=>`<button class="${i+1===d.getDate()?"today":""}" onclick="showDay(${year},${month+1},${i+1})">${i+1}</button>`).join("")}</div><div id="dayevents"></div><h3>예정된 일정</h3>${cfg.events.split("\n").filter(Boolean).map(x=>{let p=x.split("|");return `<div class="card"><b>${esc(p[2]||"일정")}</b><p class="muted">${esc(p[0]||"")} · ${esc(p[1]||"")}</p></div>`}).join("")}`;$("appbody").innerHTML=html}
function showDay(y,m,d){$("dayevents").innerHTML=`<div class="card">${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")} 선택됨</div>`}
function renderSafari(){$("appbody").innerHTML=`<div class="muted" style="text-align:center">Safari · 검색 기록</div><input class="searchbox" id="searchq" placeholder="검색 또는 웹 사이트 이름 입력"><button class="btn" style="margin-top:8px" onclick="doSearch()">검색</button><h3>최근 검색</h3>${cfg.history.split("\n").filter(Boolean).map(x=>`<div class="rowitem" onclick="$('searchq').value='${esc(x)}';doSearch()"><span>🕘</span>${esc(x)}</div>`).join("")}<p class="muted">이 브라우저의 실제 방문 기록을 읽는 대신, 스토리용 검색 기록을 재현합니다.</p><div id="searchresult"></div>`}
function doSearch(){let q=$("searchq").value.trim();if(!q)return;$("searchresult").innerHTML=`<div class="card"><b>${esc(q)}</b><p>이 검색은 스토리 속 가상 검색 화면입니다.</p><p class="muted">관리자가 지정한 기록과 검색 연출을 사용합니다.</p></div>`}
function renderNotes(){$("appbody").innerHTML=`<h3>메모</h3><textarea id="note" class="searchbox" style="min-height:180px" placeholder="메모를 입력하세요"></textarea><button class="btn" onclick="localStorage.setItem('storyphone-note',$('note').value);toast('메모 저장됨')">저장</button>`;$("note").value=localStorage.getItem("storyphone-note")||cfg.story}
function renderSettings(){$("appbody").innerHTML=`<div class="rowitem"><div class="avatar">📱</div><div><b>StoryPhone</b><small>iOS 스타일 인터랙티브 스토리</small></div></div>${["배경화면","알림","사운드 및 햅틱","개인정보 보호","일반"].map(x=>`<div class="rowitem" onclick="toast('${x} 설정은 시뮬레이션입니다')">${x}<span style="margin-left:auto;color:#888">›</span></div>`).join("")}<button class="btn" onclick="openAdmin()">콘텐츠 관리자 열기</button>`}
function renderCamera(){$("appbody").innerHTML=`<div style="height:65%;border-radius:18px;background:linear-gradient(140deg,#313845,#9eafba,#282c34);display:grid;place-items:center;color:white;font-size:14px">카메라 미리보기</div><button class="btn" style="margin-top:18px" onclick="toast('웹 카메라 기능은 별도 권한 연결이 필요해요')">● 촬영</button><p class="muted">카메라 미리보기는 현재 연출 화면입니다.</p>`}
function renderClock(){$("appbody").innerHTML=`<div style="font-size:48px;text-align:center;margin:40px 0" id="bigclock">9:41:00</div><button class="btn" onclick="toast('알람 설정은 스토리 연출 기능입니다')">＋ 알람 추가</button><h3>세계 시계</h3><div class="card">서울 <span style="float:right" id="seoulclock"></span></div>`}
function renderStory(){$("appbody").innerHTML=`<div class="card"><div style="font-size:30px">📖</div><h2>처음 발견한 메시지</h2><p>${esc(cfg.story)}</p><p class="muted">휴대전화 안에 남겨진 흔적을 하나씩 살펴보세요.</p><button class="btn" onclick="openApp('messages')">메시지 확인하기</button></div><div class="card"><b>다음 단서</b><p>캘린더와 검색 기록에 남은 단서를 찾아보세요.</p><button class="btn secondary" onclick="openApp('calendar')">캘린더 열기</button></div>`}
function renderMail(){$("appbody").innerHTML=`<h3>받은 편지함</h3><div class="card"><b>비밀 일정</b><p>오늘 확인해야 할 것이 있어.</p><span class="muted">보낸 사람: ${esc(cfg.name)}</span></div><button class="btn secondary" onclick="toast('스토리용 메일입니다')">메일 열기</button>`}
function tick(){let d=new Date(),time=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});$("statusTime").textContent=time;$("lockClock").textContent=time;$("lockDate").textContent=d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});let big=$("bigclock");if(big)big.textContent=d.toLocaleTimeString("ko-KR");let sc=$("seoulclock");if(sc)sc.textContent=time}
readConfig();fillAdmin();applyConfig();initSupabase();tick();setInterval(tick,1000);
let touchStart=0;$("screen").addEventListener("touchstart",e=>touchStart=e.touches[0].clientY,{passive:true});$("screen").addEventListener("touchend",e=>{let delta=touchStart-e.changedTouches[0].clientY;if(delta>60&&$("lock").style.display!=="none")unlock();else if(delta>60&&$("appview").style.display==="block")goHome()},{passive:true});
</script>
</body>
</html>
